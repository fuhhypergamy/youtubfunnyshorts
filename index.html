<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131b">
  <meta name="description" content="Funny Shorts — quick videos for a quick break.">
  <meta property="og:title" content="Youtub Funny Shorts">
  <meta property="og:description" content="A short video for a quick break.">
  <meta property="og:type" content="website">
  <title>Youtub Funny Shorts</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131d;
      color: #f7f4ef;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
    }

    main {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #fff;
    }

    .start-screen {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 20px;
      padding: 24px;
      background: #171717;
      color: #f5f5f5;
      text-align: center;
    }

    .start-screen[hidden] {
      display: none;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #ffffff30;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .start-button {
      min-height: 48px;
      padding: 11px 22px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #171717;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    .start-button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .playback-error {
      max-width: 420px;
      margin: 0;
      color: #f5f5f5;
      line-height: 1.5;
    }

    .start-screen[data-state="loading"] .start-button {
      display: none;
    }

    .start-screen[data-state="ready"] .spinner {
      display: none;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      background: #fff;
      object-fit: contain;
    }

  </style>
</head>
<body>
  <main>
    <video id="short-video" loop playsinline preload="auto" disablepictureinpicture disableremoteplayback>
      <source src="jumpscare-long.mp4" type="video/mp4">
      Your browser does not support HTML video.
    </video>
    <section class="start-screen" id="start-screen" data-state="loading" aria-live="polite">
      <div class="spinner" role="status" aria-label="Loading video"></div>
      <button class="start-button" id="start-button" type="button">Try again</button>
      <p class="playback-error" id="playback-error" role="status" hidden></p>
    </section>
  </main>

  <script>
    const video = document.getElementById("short-video");
    const startScreen = document.getElementById("start-screen");
    const startButton = document.getElementById("start-button");
    const playbackError = document.getElementById("playback-error");
    const main = document.querySelector("main");
    let minimumWaitElapsed = false;
    let videoReady = video.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA;

    function showReadyScreenIfLoaded() {
      if (!minimumWaitElapsed || !videoReady) return;
      startScreen.dataset.state = "ready";
      startButton.focus();
    }

    window.setTimeout(() => {
      minimumWaitElapsed = true;
      showReadyScreenIfLoaded();
    }, 2000);

    video.addEventListener("canplay", () => {
      videoReady = true;
      showReadyScreenIfLoaded();
    }, { once: true });

    startButton.addEventListener("click", () => {
      main.classList.add("is-playing");
      playbackError.hidden = true;
      video.muted = false;
      video.volume = 1;
      video.currentTime = 0;
      const fullscreenRequest = document.documentElement.requestFullscreen?.();
      const playbackRequest = video.play();

      startButton.disabled = true;

      Promise.all([playbackRequest, fullscreenRequest]).then(() => {
        startScreen.hidden = true;
      }).catch(() => {
        playbackRequest.then(() => {
          startScreen.hidden = true;
        }).catch(() => {
          playbackError.textContent = "Playback couldn't start. Press Try again to retry.";
          playbackError.hidden = false;
          startButton.disabled = false;
        });
      });
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131b">
  <meta name="description" content="Funny Shorts — quick videos for a quick break.">
  <meta property="og:title" content="Youtub Funny Shorts">
  <meta property="og:description" content="A short video for a quick break.">
  <meta property="og:type" content="website">
  <title>Youtub Funny Shorts</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131d;
      color: #f7f4ef;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
    }

    main {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    .sound-button {
      position: absolute;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      min-height: 46px;
      padding: 10px 22px;
      border: 1px solid #ffffff40;
      border-radius: 999px;
      background: #17131dcc;
      color: #fff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    .sound-button:hover {
      background: #30243c;
    }

    .sound-button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .notice {
      position: absolute;
      right: 20px;
      bottom: max(78px, calc(env(safe-area-inset-bottom) + 70px));
      left: 20px;
      margin: 0;
      color: #fff;
      font-size: 0.9rem;
      text-align: center;
      text-shadow: 0 1px 5px #000;
      pointer-events: none;
    }

    .notice[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <video id="short-video" autoplay muted loop playsinline preload="auto" disablepictureinpicture disableremoteplayback>
      <source src="jumpscare-long.mp4" type="video/mp4">
      Your browser does not support HTML video.
    </video>
    <p class="notice" id="notice">Autoplay starts muted · sudden imagery. Tap for sound and fullscreen.</p>
    <button class="sound-button" id="sound-button" type="button">Turn sound on · Fullscreen</button>
  </main>

  <script>
    const video = document.getElementById("short-video");
    const soundButton = document.getElementById("sound-button");
    const notice = document.getElementById("notice");

    soundButton.addEventListener("click", async () => {
      video.muted = false;
      video.volume = 1;
      let fullscreenRequest;
      try {
        fullscreenRequest = document.documentElement.requestFullscreen?.();
      } catch {
        fullscreenRequest = undefined;
      }

      try {
        await video.play();
        soundButton.textContent = "Sound is on · Exit fullscreen with Esc";
        notice.hidden = true;
      } catch {
        video.muted = true;
        soundButton.textContent = "Tap to enable sound";
      }

      await fullscreenRequest?.catch(() => {});
    });

    video.play().catch(() => {
      notice.textContent = "Tap to start the video.";
    });
  </script>
</body>
</html>

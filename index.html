<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131b">
  <meta name="description" content="Funny Shorts — quick videos for a quick break.">
  <meta property="og:title" content="Youtub Funny Shorts">
  <meta property="og:description" content="A short video for a quick break.">
  <meta property="og:type" content="website">
  <title>Youtub Funny Shorts</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131d;
      color: #f7f4ef;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, #373264 0, transparent 52%),
        #10131d;
    }

    main {
      width: min(100%, 760px);
    }

    .card {
      padding: clamp(24px, 6vw, 48px);
      border: 1px solid #ffffff20;
      border-radius: 24px;
      background: #181a24ed;
      box-shadow: 0 24px 80px #0007;
      text-align: center;
    }

    .brand {
      margin: 0 0 12px;
      color: #c9a8ff;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.6rem);
      line-height: 1.05;
      letter-spacing: -0.05em;
    }

    .notice {
      max-width: 520px;
      margin: 16px auto 24px;
      color: #d3cede;
      line-height: 1.6;
    }

    video {
      display: block;
      width: 100%;
      max-height: 72vh;
      margin: 0 auto;
      border-radius: 14px;
      background: #000;
      object-fit: contain;
    }

    .sound-button {
      min-height: 46px;
      margin-top: 18px;
      padding: 10px 22px;
      border: 0;
      border-radius: 999px;
      background: #c9a8ff;
      color: #20172d;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    .sound-button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .disclaimer {
      margin: 22px 0 0;
      color: #9693a2;
      font-size: 0.82rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <p class="brand">Youtub Funny Shorts</p>
      <h1>A short video for your break</h1>
      <p class="notice">
        The video starts automatically, muted, and loops. It contains sudden imagery.
        Use the player controls to pause or turn on sound.
      </p>
      <video id="short-video" autoplay muted loop playsinline controls preload="auto">
        <source src="jumpscare-long.mp4" type="video/mp4">
        Your browser does not support HTML video.
      </video>
      <button class="sound-button" id="sound-button" type="button">Turn sound on</button>
      <p class="disclaimer">
        Fan-made page; not affiliated with YouTube or any video platform.
      </p>
    </section>
  </main>

  <script>
    const video = document.getElementById("short-video");
    const soundButton = document.getElementById("sound-button");

    soundButton.addEventListener("click", async () => {
      video.muted = false;
      video.volume = 1;
      try {
        await video.play();
        soundButton.textContent = "Sound is on";
      } catch {
        video.controls = true;
        soundButton.textContent = "Use the video controls to play with sound";
      }
    });

    video.addEventListener("volumechange", () => {
      if (video.muted || video.volume === 0) {
        soundButton.textContent = "Turn sound on";
      } else {
        soundButton.textContent = "Sound is on";
      }
    });
  </script>
</body>
</html>
